[project]
name = "x1-mjlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Lulrara", email = "zhangsanjh42@126.com" }]
requires-python = ">=3.10,<3.14"
dependencies = ["mjlab", "ruff>=0.14.0"]

[project.scripts]
x1-mjlab = "x1_mjlab:main"
x1_train = "x1_mjlab.scripts.train:main"
x1_play = "x1_mjlab.scripts.play:main"
x1_list_envs = "x1_mjlab.scripts.list_envs:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
cpu = []
cu128 = []

[tool.uv]
default-groups = ["cu128"]
# 强制覆盖依赖版本（注意这里是数组格式）
override-dependencies = [
  "torch==2.9.0+cu128",
  "torchvision==0.24.0+cu128",
]
conflicts = [
  [
    { group = "cpu" },
    { group = "cu128" },
  ],
]

# 配置索引源
[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 配置包源
[tool.uv.sources]
mjlab = { path = "../mjlab", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
